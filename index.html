<!-- ===== 移語通 MAX｜口說發音評分修正補丁 =====
  用法：把下面整個 <script>…</script> 貼到原檔「最後一個 </script> 之後、</body> 之前」。
  原理：後載入的同名全域函式會覆蓋舊版，不需要改動原本的程式碼。
-->
<script>
/* 1) 嚴重 BUG：chineseSpeechRequestId 從未宣告 → ReferenceError（TTS、口說遊戲換題、麥克風全部中斷）。已宣告則略過。 */
if (typeof chineseSpeechRequestId === 'undefined') window.chineseSpeechRequestId = 0;
let activeSpeechFinisher = null;

/* 2) 辨識結果正規化：簡體→繁體、中文數字↔阿拉伯數字（辨識器常把「一」回傳成「1」） */
const SPEECH_S2T = new Map();
(function () {
    const chars = Array.from('这這买買卖賣钱錢们們个個为為么麼说說话話请請问問谢謝对對还還没沒会會开開关關车車门門间間时時点點现現发發过過后後来來国國学學习習师師医醫药藥员員经經济濟办辦单單号號码碼机機电電脑腦网網络絡厂廠场場产產质質检檢备備设設货貨运運输輸装裝价價贵貴乐樂热熱难難觉覺欢歡爱愛听聽读讀写寫给給帮幫钟鐘样樣体體头頭脸臉脚腳痒癢烫燙伤傷烧燒针針术術疗療护護复復况況诊診断斷证證书書险險劳勞动動资資费費补補偿償纠糾纷紛调調诉訴违違约約签簽报報导導总總务務际際税稅获獲转轉换換择擇续續规規则則须須应應该該当當实實于於与與从從见見认認识識记記让讓谁誰吗嗎邻鄰灯燈钥鑰烦煩脏髒闹鬧静靜洁潔厕廁阳陽厨廚饭飯鸡雞鱼魚饿餓饱飽汤湯饮飲馆館厅廳铁鐵铃鈴邮郵递遞银銀币幣汇匯账帳户戶额額余餘储儲辆輛驾駕驶駛骑騎灾災罚罰条條权權议議协協谈談讨討论論谅諒简簡乡鄉亲親爷爺妈媽儿兒孙孫兴興惊驚担擔虑慮紧緊张張梦夢键鍵联聯绝絕严嚴轻輕长長宽寬满滿够夠别別种種类類层層楼樓区區县縣镇鎮湾灣岛島语語译譯词詞汉漢讲講试試练練评評级級测測验驗题題错錯误誤选選项項确確订訂购購优優压壓职職业業处處组組结結线線红紅绿綠黄黃岁歲两兩块塊数數里裡');
    for (let i = 0; i + 1 < chars.length; i += 2) SPEECH_S2T.set(chars[i], chars[i + 1]);
})();
const SPEECH_DIGITS = { '零': '0', '〇': '0', '一': '1', '二': '2', '兩': '2', '三': '3', '四': '4', '五': '5', '六': '6', '七': '7', '八': '8', '九': '9' };

function cleanSpeechChars(str) {
    return Array.from(String(str || '').normalize('NFKC'))
        .map(ch => SPEECH_S2T.get(ch) || SPEECH_DIGITS[ch] || ch)
        .join('')
        .replace(/[^\u3400-\u9fffA-Za-z0-9]/g, '')
        .toLowerCase();
}

/* 目標字也要用同一套正規化，否則「一」vs「1」會被判錯 */
function alignSpeechChars(targetZh, spokenTranscript) {
    const isHan = ch => /[\u3400-\u9fff]/.test(ch);
    const isScored = ch => /[\u3400-\u9fffA-Za-z0-9]/.test(ch);
    const targetChars = Array.from(String(targetZh || ''));
    const A = targetChars.filter(isScored).map(ch => cleanSpeechChars(ch) || ch.toLowerCase());
    const B = Array.from(cleanSpeechChars(spokenTranscript)).slice(0, 200);
    const weight = (a, b) => {
        if (a === b) return 2;
        if (!isHan(a) || !isHan(b)) return 0;
        const key = speechCharKey(a);
        return key && key === speechCharKey(b) ? 1 : 0;
    };
    const dp = Array.from({ length: A.length + 1 }, () => new Array(B.length + 1).fill(0));
    for (let i = 1; i <= A.length; i++) {
        for (let j = 1; j <= B.length; j++) {
            const w = weight(A[i - 1], B[j - 1]);
            dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1], w ? dp[i - 1][j - 1] + w : 0);
        }
    }
    const states = new Array(A.length).fill('miss');
    let i = A.length, j = B.length;
    while (i > 0 && j > 0) {
        const w = weight(A[i - 1], B[j - 1]);
        if (w && dp[i][j] === dp[i - 1][j - 1] + w) { states[i - 1] = w === 2 ? 'ok' : 'near'; i--; j--; }
        else if (dp[i - 1][j] >= dp[i][j - 1]) i--;
        else j--;
    }
    let k = 0;
    return targetChars.map(ch => isScored(ch) ? { ch, state: states[k++] } : { ch, state: 'pun' });
}

/* 3) 題庫：排除單字(辨識不準)、超長句、含數字/英文的題目；翻譯改成即時取，切換語言才會更新 */
function getSpeakPracticePool() {
    const usable = zh => {
        const n = Array.from(String(zh || '')).length;
        return n >= 2 && n <= 24 && /^[\u3400-\u9fff，。！？、；：]+$/.test(zh);
    };
    const sentencePool = sentencesData.filter(s => usable(s.zh))
        .map(s => ({ type: 'sentence', cat: s.cat, zh: s.zh, py: s.py, src: s }));
    const vocabPool = masterVocab.slice(0, 300).filter(w => usable(w.zh))
        .map(w => ({ type: 'vocab', cat: w.cat, zh: w.zh, py: w.py, src: w }));
    return [...sentencePool, ...vocabPool];
}
function speakItemCatLabel(item) {
    if (item.type === 'sentence') {
        const info = catInfo[item.cat];
        return info ? `${info.icon} ${info.labels[currentLang]}` : '💬 Kalimat';
    }
    return `📘 ${uiText().dict[item.cat] || 'Kosakata'}`;
}
function renderSpeakGameCard() {
    if (!currentSpeakItem) return;
    document.getElementById('speak-game-cat').textContent = speakItemCatLabel(currentSpeakItem);
    document.getElementById('speak-target-zh').textContent = currentSpeakItem.zh;
    document.getElementById('speak-target-py').textContent = currentSpeakItem.py;
    document.getElementById('speak-target-lang').textContent = currentSpeakItem.src[currentLang] || currentSpeakItem.src.id || '';
    if (!isSpeechListening) document.getElementById('speak-game-status').textContent = extraText().speakTapToStart;
}

/* 4) 停止辨識：同時清掉「聆聽中…」的殘留畫面 */
function resetSpeechIdleUi(context) {
    if (context === 'modal') {
        const box = document.getElementById('modal-speech-box');
        if (box) box.classList.add('hidden');
    } else {
        const status = document.getElementById('speak-game-status');
        if (status) status.textContent = extraText().speakTapToStart;
    }
}
function stopActiveSpeechRecognition() {
    const wasListening = isSpeechListening;
    const ctx = activeSpeechContext;
    isSpeechListening = false;
    activeSpeechFinisher = null;
    activeSpeechContext = null;
    clearTimeout(speechMaxTimer);
    clearTimeout(speechSilenceTimer);
    const finished = activeRecognition;
    activeRecognition = null;
    if (finished) {
        ['onresult', 'onerror', 'onend', 'onspeechend', 'onaudiostart'].forEach(name => { finished[name] = null; });
        try { finished.abort(); } catch (e) {}
    }
    const gameMicBtn = document.getElementById('speak-game-mic-btn');
    if (gameMicBtn) gameMicBtn.classList.remove('mic-listening');
    const modalMicBtn = document.getElementById('modal-mic-btn');
    if (modalMicBtn) modalMicBtn.classList.remove('mic-listening');
    if (wasListening && ctx) resetSpeechIdleUi(ctx);
}

/* 5) 主流程：計時器改成「開始收音後才計時」，依句子長度放寬，停頓容忍 2 秒，再按麥克風=立即結算 */
function triggerSpeechAssessment(context) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const t = extraText();

    if (isSpeechListening) {
        if (activeSpeechFinisher) activeSpeechFinisher();
        else stopActiveSpeechRecognition();
        return;
    }
    if (window.isSecureContext === false) { showSpeechProblem(context, speechMsg('insecure')); return; }
    if (!SpeechRecognition) { showSpeechProblem(context, speechMsg('unsupported')); return; }

    const targetText = context === 'modal' ? currentModalZh : (currentSpeakItem ? currentSpeakItem.zh : '');
    if (!targetText) return;

    stopActiveSpeechRecognition();
    chineseSpeechRequestId++;
    clearTimeout(chineseSpeechTimer);
    clearTimeout(chineseSpeechWatchdog);
    if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }

    let recognition;
    try { recognition = new SpeechRecognition(); }
    catch (err) { showSpeechProblem(context, speechMsg('generic')); return; }

    activeRecognition = recognition;
    activeSpeechContext = context;
    isSpeechListening = true;
    const isStale = () => recognition !== activeRecognition;

    recognition.lang = 'zh-TW';
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 3;

    const micBtn = document.getElementById(context === 'modal' ? 'modal-mic-btn' : 'speak-game-mic-btn');
    if (micBtn) micBtn.classList.add('mic-listening');

    clearSpeechResultUi(context);
    if (context === 'game') {
        document.getElementById('speak-game-result').classList.add('hidden');
        document.getElementById('speak-game-status').textContent = t.speakListening;
    } else {
        document.getElementById('modal-speech-box').classList.remove('hidden');
        document.getElementById('modal-speech-stars').textContent = '🎙️';
        document.getElementById('modal-speech-msg').textContent = t.speakListening;
        document.getElementById('modal-speech-transcript').textContent = '';
    }

    let handledResult = false;
    let lastHeard = '';
    const heardCandidates = new Set();
    const firstWordMs = Math.min(8000 + Array.from(cleanSpeechChars(targetText)).length * 600, 25000);

    const showLive = text => {
        const el = document.getElementById(context === 'modal' ? 'modal-speech-transcript' : 'speak-game-status');
        if (el) el.textContent = `${verdictText('live')}：${text}`;
    };

    const finish = candidates => {
        if (handledResult || isStale()) return;
        handledResult = true;
        (candidates || []).forEach(c => { if (c) heardCandidates.add(c); });
        if (lastHeard) heardCandidates.add(lastHeard);
        clearTimeout(speechSilenceTimer);
        clearTimeout(speechMaxTimer);
        let best = null;
        heardCandidates.forEach(candidate => {
            const analysis = analyzeSpeech(targetText, candidate);
            if (!best || analysis.stars > best.stars || (analysis.stars === best.stars && analysis.percent > best.percent)) best = analysis;
        });
        stopActiveSpeechRecognition();
        renderSpeechRatingOutput(context, best || analyzeSpeech(targetText, ''));
    };

    const giveUp = messageKey => {
        if (isStale() || handledResult) return;
        if (lastHeard) { finish([lastHeard]); return; }
        stopActiveSpeechRecognition();
        showSpeechProblem(context, speechMsg(messageKey));
    };

    activeSpeechFinisher = () => {
        if (isStale() || handledResult) return;
        if (lastHeard) finish([lastHeard]);
        else stopActiveSpeechRecognition();
    };

    recognition.onaudiostart = () => {
        if (isStale() || handledResult) return;
        clearTimeout(speechMaxTimer);
        speechMaxTimer = setTimeout(() => giveUp('noSpeech'), firstWordMs);
    };

    recognition.onresult = event => {
        if (isStale() || handledResult || !event.results || !event.results.length) return;
        let fullTranscript = '';
        let hasFinal = false;
        const alternatives = [];
        for (let i = 0; i < event.results.length; i++) {
            const res = event.results[i];
            if (res[0] && res[0].transcript) fullTranscript += res[0].transcript;
            for (let j = 0; j < res.length; j++) if (res[j] && res[j].transcript) alternatives.push(res[j].transcript);
            if (res.isFinal) hasFinal = true;
        }
        if (fullTranscript) {
            lastHeard = fullTranscript;
            heardCandidates.add(fullTranscript);
            alternatives.forEach(a => heardCandidates.add(a));
            showLive(lastHeard);
            clearTimeout(speechMaxTimer);
            speechMaxTimer = setTimeout(() => giveUp('noSpeech'), 10000);
        }
        if (hasFinal) {
            finish([fullTranscript, ...alternatives]);
        } else if (lastHeard) {
            clearTimeout(speechSilenceTimer);
            speechSilenceTimer = setTimeout(() => giveUp('noSpeech'), 2000);
        }
    };

    recognition.onspeechend = () => {
        if (isStale() || handledResult) return;
        clearTimeout(speechSilenceTimer);
        speechSilenceTimer = setTimeout(() => {
            if (isStale() || handledResult) return;
            if (lastHeard) finish([lastHeard]);
            else { try { recognition.stop(); } catch (e) {} }
        }, 700);
    };

    recognition.onerror = event => {
        if (isStale() || handledResult) return;
        const code = event && event.error;
        console.warn('SpeechRecognition error:', code);
        const fatal = ['not-allowed', 'service-not-allowed', 'audio-capture', 'language-not-supported'].includes(code);
        if (lastHeard && !fatal && code !== 'aborted') { finish([lastHeard]); return; }
        stopActiveSpeechRecognition();
        if (code === 'aborted') return;
        showSpeechProblem(context, speechMsg(speechErrorKey(code)));
    };

    recognition.onend = () => {
        if (isStale() || handledResult) return;
        if (lastHeard) { finish([lastHeard]); return; }
        stopActiveSpeechRecognition();
        showSpeechProblem(context, t.speakNoMatch);
    };

    try {
        recognition.start();
        // 權限視窗還沒按、尚未開始收音時的保底（30 秒），不會再在 9 秒內誤判「服務無回應」
        speechMaxTimer = setTimeout(() => giveUp('stuck'), 30000);
    } catch (err) {
        console.warn('SpeechRecognition start failed:', err);
        stopActiveSpeechRecognition();
        showSpeechProblem(context, speechMsg('generic'));
    }
}

/* 6) 切換分頁時停止錄音 */
(function () {
    const originalSwitchView = switchView;
    switchView = function (view) { stopActiveSpeechRecognition(); return originalSwitchView(view); };
})();
</script>
